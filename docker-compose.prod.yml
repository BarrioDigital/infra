version: '3.8'

services:
  # =======================================================
  # RABBITMQ
  # =======================================================
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: barriodigital-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./mq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - barriodigital-network

  # ======================================================
  # ZOOKEEPER Y KAFKA
  # ======================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: barriodigital-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - barriodigital-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: barriodigital-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092,
        PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - barriodigital-network

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: barriodigital-kafka-init
    depends_on:
      - kafka
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "echo 'Esperando que Kafka este disponible...'; \
        until kafka-topics --bootstrap-server kafka:9092 --list > /dev/null 2>&1; \
        do sleep 3; done; \
        echo 'Kafka disponible. Creando topicos...'; \
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic requests.events --partitions 3 --replication-factor 1; \
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic audit.timeline --partitions 3 --replication-factor 1; \
        echo 'Topicos creados exitosamente:'; \
        kafka-topics --bootstrap-server kafka:9092 --list"
      ]
    networks:
      - barriodigital-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: barriodigital-kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: barriodigital
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - barriodigital-network

  # ======================================================
  # MICROSERVICIOS BACKEND (DESPLIEGUE AWS ECR)
  # ======================================================
  ms-barriodigital-catalog:
    image: 726357411862.dkr.ecr.us-east-1.amazonaws.com/ms-barriodigital-catalog:latest
    container_name: barriodigital-catalog
    restart: always
    ports:
      - "8081:8081"
    networks:
      - barriodigital-network

  ms-barriodigital-requests:
    image: 726357411862.dkr.ecr.us-east-1.amazonaws.com/ms-barriodigital-requests:latest
    container_name: barriodigital-requests
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - rabbitmq
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_RABBITMQ_HOST: rabbitmq
    networks:
      - barriodigital-network

  ms-barriodigital-notify:
    image: 726357411862.dkr.ecr.us-east-1.amazonaws.com/ms-barriodigital-notify:latest
    container_name: barriodigital-notify
    restart: always
    ports:
      - "8083:8083"
    depends_on:
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    networks:
      - barriodigital-network

  ms-barriodigital-audit:
    image: 726357411862.dkr.ecr.us-east-1.amazonaws.com/ms-barriodigital-audit:latest
    container_name: barriodigital-audit
    restart: always
    ports:
      - "8084:8084"
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - barriodigital-network

  ms-barriodigital-report:
    image: 726357411862.dkr.ecr.us-east-1.amazonaws.com/ms-barriodigital-report:latest
    container_name: barriodigital-report
    restart: always
    ports:
      - "8085:8085"
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - barriodigital-network

# ========================================================
# RED GENERAL
# ========================================================
networks:
  barriodigital-network:
    driver: bridge