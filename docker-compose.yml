version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: barriodigital-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: barriouser
      MYSQL_PASSWORD: barriopassword
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - barriodigital-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: barriodigital-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./mq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./mq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - barriodigital-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: barriodigital-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - barriodigital-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: barriodigital-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - barriodigital-network

  init-kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --list
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic requests.events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic audit.timeline --partitions 3 --replication-factor 1
      "
    networks:
      - barriodigital-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: barriodigital-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - barriodigital-network

volumes:
  mysql_data:

networks:
  barriodigital-network:
    name: barriodigital-network
    driver: bridge # Al levantar este compose, Docker creará esta red automáticamente